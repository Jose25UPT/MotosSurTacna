# Postgres tuning para servidor ~1GB RAM
# Ajustes orientados a reducir huella y mantener rendimiento aceptable

shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 4MB
maintenance_work_mem = 64MB
autovacuum_work_mem = 64MB
max_connections = 30
wal_buffers = 4MB
checkpoint_timeout = 15min
max_wal_size = 512MB
min_wal_size = 128MB
random_page_cost = 1.1
effective_io_concurrency = 100
temp_buffers = 8MB
jit = off

# Logging moderado
log_min_duration_statement = 2000  # Log solo queries >2s
log_checkpoints = off
log_connections = off
log_disconnections = off

# Seguridad y consistencia
full_page_writes = on
synchronous_commit = on

# Autovacuum más frecuente si tablas crecen
autovacuum_naptime = 30s
