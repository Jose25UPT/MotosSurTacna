services:
  db:
    image: postgres:15-alpine
    container_name: postgres_tienda_motos
    restart: unless-stopped
    environment:
      - POSTGRES_DB=tienda_motos
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    # No exponer el puerto públicamente; sólo accesible vía red interna
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./bd/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./bd/schema/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tienda_motos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    shm_size: 256mb
    networks:
      - internal_network
  backend:
    build: ./backend
    container_name: backend_motos
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=tienda_motos
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - internal_network
      - web
volumes:
  db_data:

networks:
  internal_network:
    internal: true
  web:
    driver: bridge

